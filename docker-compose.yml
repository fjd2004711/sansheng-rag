
# Backend development configuration
# Usage: docker-compose up -d

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: self_correcting_rag_backend:dev
    container_name: self_correcting_rag_backend
    ports:
      - "8010:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/cli:/app/cli:ro
      - media_data:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - ENVIRONMENT=local
      - POSTGRES_HOST=db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    # --ws websockets-sansio: uvicorn's `auto` picks the legacy websockets impl,
    # which is broken with websockets >=14 (handshake → HTTP 500). The sansio
    # implementation is the modern, compatible one. Required for the chat WS.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload --ws websockets-sansio
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped


  db:
    image: postgres:16-alpine
    container_name: self_correcting_rag_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-self_correcting_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port exposed only for local development - remove in production
    ports:
      - "55432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: self_correcting_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  # Free metasearch for research mode; the backend reaches it at http://searxng:8080 (RESEARCH_SEARXNG_URL).
  searxng:
    image: searxng/searxng:2026.9.25-12f8b6515
    container_name: self_correcting_rag_searxng
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-searxng-secret}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  media_data:
  postgres_data:
  qdrant_data:
