<text x="460.0" y="150.0" font-size="11.5" fill="#7A7064" text-anchor="middle" font-weight="normal">对话与证据　·　Agent Trace（React Flow）　·　编排画布与调度时间线　·　评测看板（ECharts）　·　报告阅读与导出</text>
