<text x="460.0" y="304.0" font-size="11.5" fill="#7A7064" text-anchor="middle" font-weight="normal">节点编译为调度组：agent · map（按数据扇出） · gate（质量门） · loop（有界修复） · merge</text>
<rect x="40" y="324" width="840" height="54" fill="#FAF6EC" stroke="#2B2620" stroke-width="1.4"/>
