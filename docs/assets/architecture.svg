<text x="460.0" y="242.0" font-size="11.5" fill="#7A7064" text-anchor="middle" font-weight="normal">YAML → Pydantic 校验 → PostgreSQL　·　知识库 / Agent 团队 / 工作流 / 策略（预算、质量门、轮次、并发）</text>
