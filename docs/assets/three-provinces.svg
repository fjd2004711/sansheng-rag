<line x1="595" y1="240" x2="610" y2="240" stroke="#2B2620" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M455 380 C455 410 200 410 175 380" stroke="#A83A2C" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#r)"/>
<text x="460.0" y="432" font-size="12.5" fill="#A83A2C" text-anchor="middle" font-weight="normal">不达标：审核打回，补检索并逐章重写，复核后再过质量门（修复轮数有上限）</text>
