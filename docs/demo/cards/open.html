<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>三省</title>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#1F2A44;color:#F2ECDF;font-family:"Songti SC",serif}
.frame{position:absolute;inset:56px;border:2px solid #c9b98f;outline:1px solid #c9b98f;outline-offset:-12px}
.slip{position:absolute;left:300px;top:170px;width:170px;height:700px;background:#F2ECDF;color:#231F1A;border:2px solid #231F1A;outline:1px solid #231F1A;outline-offset:-9px;display:flex;flex-direction:column;align-items:center;padding-top:70px;box-sizing:border-box;opacity:0;animation:in 1.2s .2s forwards}
.big{font-size:150px;font-weight:700;line-height:1.15;text-align:center}
.small{font:26px/1.15 "Kaiti SC",serif;margin-top:34px;text-align:center;color:#4b4339}
.seal{position:absolute;left:490px;top:770px;width:92px;height:92px;border:4px solid #B4432F;color:#B4432F;font:700 34px "Kaiti SC",serif;display:grid;grid-template-columns:1fr 1fr;place-items:center;line-height:1;opacity:0;transform:scale(1.6);animation:stamp .35s 2.6s forwards}
.right{position:absolute;left:700px;top:300px}
.eyebrow{font:34px "Kaiti SC",serif;color:#c9b98f;letter-spacing:14px;opacity:0;animation:in 1s 1s forwards}
.title{font-size:84px;font-weight:700;line-height:1.35;margin:44px 0 40px;letter-spacing:4px;opacity:0;animation:in 1.2s 1.4s forwards}
.sub{font:40px/1.7 "Kaiti SC",serif;color:#d9cfbd;opacity:0;animation:in 1.2s 2.1s forwards}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes stamp{to{opacity:1;transform:scale(1)}}
</style></head><body>
<div class="frame"></div>
<div class="slip"><div class="big">三<br>省</div><div class="small">起<br>草<br>·<br>审<br>核<br>·<br>执<br>行</div></div>
<div class="seal"><span>三</span><span>省</span><span>核</span><span>验</span></div>
<div class="right">
<div class="eyebrow">赛题一 · Agent 编排创新应用</div>
<div class="title">可验证的<br>多智能体编排调度平台</div>
<div class="sub">写的人不审，审的人不写</div>
</div>
</body></html>
