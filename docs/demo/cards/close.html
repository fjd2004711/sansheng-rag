<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>谢谢</title>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#1F2A44;color:#F2ECDF;font-family:"Songti SC",serif}
.frame{position:absolute;inset:56px;border:2px solid #c9b98f;outline:1px solid #c9b98f;outline-offset:-12px}
.q{position:absolute;left:0;right:0;top:330px;text-align:center;font-size:76px;font-weight:700;letter-spacing:6px;line-height:1.5;opacity:0;animation:in 1.4s .3s forwards}
.q em{font-style:normal;font-size:56px;color:#E0A08F}
.s{position:absolute;left:0;right:0;top:600px;text-align:center;font:38px "Kaiti SC",serif;color:#c9b98f;letter-spacing:12px;opacity:0;animation:in 1.2s 2.2s forwards}
.seal{position:absolute;left:912px;top:720px;width:96px;height:96px;border:4px solid #B4432F;color:#B4432F;font:700 36px "Kaiti SC",serif;display:grid;grid-template-columns:1fr 1fr;place-items:center;line-height:1;opacity:0;transform:scale(1.6);animation:stamp .35s 3.6s forwards}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes stamp{to{opacity:1;transform:scale(1)}}
</style></head><body>
<div class="frame"></div>
<div class="q">三省<br><em>可验证的多智能体编排调度平台</em></div>
<div class="s">谢 谢 观 看</div>
<div class="seal"><span>三</span><span>省</span><span>谢</span><span>谢</span></div>
</body></html>
